services:
  neo4j:
    image: neo4j:latest
    user: "0"
    volumes:
      - ./neo4j/logs:/logs:Z
      - ./neo4j/config:/config:Z
      - ./neo4j/data:/data:Z
      - ./neo4j/plugins:/plugins:Z
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always

  app:
    build: ./app
    working_dir: /app
    volumes:
      - ./app:/app:Z
      - ./data:/app/data:Z
      - ./filter_data.py:/app/filter_data.py:Z
    ports:
      - "5001:5000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      # Auto-generate filtered CSVs in ./data/ from the downloaded ZIP on first run
      - AUTO_PREPARE_DATA=1
    depends_on:
      - neo4j
    command: ["python", "src/startup.py"]
    restart: always